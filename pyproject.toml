[project]
name = "genqai"
version = "0.1.0"
description = "GenQAI: hardware-aware generative quantum circuit synthesis (ADAPT-GQE reproduction)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "rdkit>=2024.3", 
  "qiskit>=2.0", "qiskit-nature==0.8.*", "qiskit-algorithms==0.4.*", "pyscf>=2.6",
  "numpy", "scipy", "torch>=2.2", "matplotlib", "qiskit-ionq>=1.0", "qiskit-aer>=0.15", "scikit-learn>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "py3Dmol>=2.0"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["genqai"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::scipy.sparse.SparseEfficiencyWarning"]
