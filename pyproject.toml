[project]
name = "quantinuum-nvidia-pfizer-hpc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.29.0",
    "mace-torch>=0.3.16",
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "openfermion>=1.8.1",
    "pyscf>=2.14.0",
    "rdkit>=2026.9.1",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hamgen"]
